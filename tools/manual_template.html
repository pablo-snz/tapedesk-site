<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapeDesk · manual</title>
<meta name="description" content="el manual de TapeDesk: tape, synth, track, mix, cintas, eject, sync, plugin y ajustes.">
<link rel="icon" href="img/mark.svg">
<link rel="apple-touch-icon" href="img/mark-1024.png">
<link rel="preload" href="fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:200 600;font-display:swap;
    src:url(fonts/hanken-grotesk-latin-ext.woff2) format("woff2");
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:200 600;font-display:swap;
    src:url(fonts/hanken-grotesk-latin.woff2) format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  :root{
    --bg:#141412; --bg2:#20201E; --piece:#292927;
    --line:#595957; --line2:#3B3B38; --edge:#80807D;
    --ink:#DADAD6; --ink2:#A3A39E; --ink3:#6E6E6B;
    --rec:#F25A2A; --loop:#C08468;
    --g1:#5F7BBC; --g2:#CA6D75; --g3:#85A457; --g4:#9770BC;
    --motor:#6C72A0;
    --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --r-key:4px; --r-sheet:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:24px}
  body{font-family:var(--sans);font-weight:400;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px}
  a{color:inherit}
  b{font-weight:500}
  em{font-style:italic}
  code{font-family:var(--mono);font-size:.84em;color:var(--ink);background:var(--piece);padding:1px 6px 2px;border-radius:var(--r-key)}
  code.rec{color:var(--rec)}
  code.loop{color:var(--loop)}
  code.motor{box-shadow:inset 0 -2px 0 var(--motor)}
  code.g1{box-shadow:inset 0 -2px 0 var(--g1)}
  code.g2{box-shadow:inset 0 -2px 0 var(--g2)}
  code.g3{box-shadow:inset 0 -2px 0 var(--g3)}
  code.g4{box-shadow:inset 0 -2px 0 var(--g4)}

  .mark{width:28px;height:28px;flex:0 0 auto;color:var(--ink)}
  .top{border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:18px;padding-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:18px;text-decoration:none}
  .toplinks{display:flex;gap:26px;font-size:15px}
  .toplinks a{text-decoration:none;color:var(--ink2)}
  .toplinks a:hover,.toplinks a.here{color:var(--ink)}
  @media(max-width:520px){.wrap{padding-left:20px;padding-right:20px}.toplinks{gap:14px;font-size:14px}.toplinks a[href^=mailto]{display:none}}

  .intro{padding-block:72px 8px}
  .intro h1{font-size:clamp(56px,9vw,104px);font-weight:300;letter-spacing:-.04em;line-height:.95}

  .layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:64px;padding-block:40px 96px}
  .toc{position:sticky;top:24px;align-self:start;max-height:calc(100vh - 48px);overflow:auto;scrollbar-width:thin;padding-right:6px}
  .toc summary{list-style:none;font-size:13px;color:var(--ink3);margin-bottom:12px;cursor:pointer}
  .toc summary::-webkit-details-marker{display:none}
  .toc a{display:flex;gap:10px;align-items:baseline;color:var(--ink2);text-decoration:none;padding:4px 0;font-size:15px;line-height:1.35}
  .toc a .tn{font-family:var(--mono);font-size:11.5px;color:var(--ink3);min-width:30px}
  .toc a.l3{font-size:13.5px;color:var(--ink3)}
    .toc a:hover,.toc a.on{color:var(--ink)}
  .toc a code{font-size:.82em;padding:0;background:none;box-shadow:none;color:inherit}
  @media(max-width:880px){.layout{grid-template-columns:1fr;gap:24px}.toc{position:static;max-height:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}}

  .doc{max-width:720px}
  .doc h2{font-size:clamp(34px,4.6vw,48px);font-weight:300;letter-spacing:-.03em;line-height:1.05;margin:96px 0 20px;padding-top:28px;border-top:1px solid var(--line)}
  .doc h2:first-child{margin-top:0}
  .doc h3{font-size:23px;font-weight:400;letter-spacing:-.01em;margin:52px 0 14px}
  .doc .num{display:block;font-family:var(--mono);font-size:12.5px;color:var(--ink3);letter-spacing:0;margin-bottom:10px}
  .doc h3 .num{display:inline;margin:0 12px 0 0;font-size:12px}
  .doc h2 code,.doc h3 code{font-size:.8em}
  .doc p{font-size:17px;color:var(--ink2);line-height:1.66;margin-top:14px}
  .doc p b,.doc li b{color:var(--ink)}
  .doc ul{margin:12px 0 0 20px}
  .doc li{font-size:17px;color:var(--ink2);line-height:1.62;margin-top:8px}
  .doc li::marker{color:var(--ink3)}
  .doc .modenote{font-family:var(--mono);font-size:12.5px;color:var(--ink3);margin-top:-4px}
  .doc .modenote code{background:none;padding:0;color:var(--ink3)}
  .doc .aside{font-size:15px;color:var(--ink3);border-left:2px solid var(--line);padding-left:16px;margin-top:18px}
  .doc ul.terms{list-style:none;margin-left:0;columns:2;column-gap:40px}
  .doc ul.terms li{font-size:15px;margin-top:6px;break-inside:avoid}
  .doc ul.terms a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--edge)}
  @media(max-width:600px){.doc ul.terms{columns:1}}

  .phgroup{display:flex;flex-wrap:wrap;gap:22px 26px;align-items:flex-start;margin:26px 0 10px}
  .phfig{margin:0;max-width:100%}
  .phrow{display:flex;gap:14px;flex-wrap:wrap}
  .ph{position:relative;background:var(--bg2);border:1px dashed var(--line);border-radius:var(--r-sheet)}
  .ph .id{position:absolute;top:10px;left:12px;right:12px;font-family:var(--mono);font-size:10.5px;color:var(--ink3);line-height:1.4}
  .ph.phone{width:160px;aspect-ratio:1206/2622}
  .phfig.multi .ph.phone{width:112px}
  .ph.pad{width:min(100%,340px);aspect-ratio:4/3}
  .ph.sheet{width:100%;aspect-ratio:16/8}
  .ph.photo{width:min(100%,300px);aspect-ratio:4/3}
  .phfig figcaption{font-size:14px;color:var(--ink3);margin-top:10px;max-width:260px;line-height:1.45}
  .phfig.pad figcaption,.phfig.sheet figcaption{max-width:340px}
  .phfig.sheet{width:100%}

  .drawing{margin:24px 0 8px}
  .drawing svg{display:block;width:100%;height:auto}
  .drawing svg .mono{font-family:var(--mono)}
  .drawing svg .sans{font-family:var(--sans)}
  .phonefig{width:240px}
  .eq-draw{margin-top:28px}

  footer{border-top:1px solid var(--line);padding-block:56px 72px}
  footer .row{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap}
  footer .links a{display:block;font-size:16px;color:var(--ink2);text-decoration:none;margin-bottom:10px}
  footer .links a:hover{color:var(--ink)}
  footer .print{font-size:13px;color:var(--ink3);margin-top:40px}
</style>
</head>
<body>

<script>
  const toc=document.querySelector('.toc');
  if(window.matchMedia('(max-width:880px)').matches) toc.removeAttribute('open');
  const links=[...toc.querySelectorAll('a')];
  const byId=new Map(links.map(a=>[a.hash.slice(1),a]));
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.remove('on'));byId.get(e.target.id)?.classList.add('on');}});
  },{rootMargin:'0px 0px -80% 0px'});
  document.querySelectorAll('.doc h2[id],.doc h3[id]').forEach(h=>io.observe(h));
</script>
</body>
