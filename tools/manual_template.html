<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" href="img/mark.svg">
<link rel="apple-touch-icon" href="img/mark-1024.png">
<link rel="preload" href="fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  (function () {
    var params = new URLSearchParams(location.search), modo = params.get('modo');
    if (modo !== 'grabadora' && modo !== 'groovebox') modo = 'groovebox';
    document.documentElement.dataset.modo = modo;
    if (params.has('borrador')) document.documentElement.classList.add('borrador');
  })();
</script>
<style>
  @font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:200 600;font-display:swap;
    src:url(fonts/hanken-grotesk-latin-ext.woff2) format("woff2");
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:200 600;font-display:swap;
    src:url(fonts/hanken-grotesk-latin.woff2) format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  :root{
    --bg:#141412; --bg2:#1C1C1A; --piece:#292927;
    --line:#595957; --line2:#353532; --edge:#80807D;
    --ink:#DADAD6; --ink2:#A3A39E; --ink3:#6E6E6B;
    --paper:#F6F5F1;
    --rec:#F25A2A; --loop:#C08468;
    --g1:#5F7BBC; --g2:#CA6D75; --g3:#85A457; --g4:#9770BC;
    --motor:#8D92C4;
    --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --r-key:4px; --r-sheet:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:24px}
  .doc h2[id],.doc h3[id]{cursor:pointer}
  .enlace{font:13px/1 var(--mono);color:var(--ink3);background:none;border:0;padding:4px 6px;margin-left:4px;cursor:pointer;opacity:0;transition:opacity .15s;vertical-align:middle;letter-spacing:0}
  .doc h2:hover .enlace,.doc h3:hover .enlace,.enlace:focus-visible{opacity:1}
  .enlace:hover{color:var(--ink)}
  @media (hover:none){.enlace{opacity:.55}}
  body{font-family:var(--sans);font-weight:400;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px}
  a{color:inherit}
  b{font-weight:500}
  em{font-style:italic}
  code{font-family:var(--mono);font-size:.86em;color:var(--ink);white-space:nowrap}
  code.rec{color:var(--rec)}
  code.loop{color:var(--loop)}
  code.motor,code.g1,code.g2,code.g3,code.g4{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
  code.motor{text-decoration-color:var(--motor)}
  code.g1{text-decoration-color:var(--g1)}
  code.g2{text-decoration-color:var(--g2)}
  code.g3{text-decoration-color:var(--g3)}
  code.g4{text-decoration-color:var(--g4)}

  html[data-modo="grabadora"] [data-solo="groovebox"],
  html[data-modo="groovebox"] [data-solo="grabadora"]{display:none!important}

  .mark{width:28px;height:28px;flex:0 0 auto;color:var(--ink)}
  .top{border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:18px;padding-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:18px;text-decoration:none}
  .toplinks{display:flex;align-items:center;gap:26px;font-size:15px}
  .toplinks a{text-decoration:none;color:var(--ink2)}
  .toplinks a:hover,.toplinks a.here{color:var(--ink)}
  @media(max-width:520px){.wrap{padding-left:20px;padding-right:20px}.toplinks{gap:14px;font-size:14px}.toplinks a[href^=mailto]{display:none}}

  .intro{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px 48px;padding-block:72px 40px;border-bottom:1px solid var(--line)}
  .intro h1{font-size:clamp(56px,9vw,104px);font-weight:300;letter-spacing:-.04em;line-height:.95}
  .modo-bloque{max-width:380px}
  .modo{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .modo button{font-family:var(--mono);font-size:15px;background:none;color:var(--ink2);border:0;padding:10px 20px;cursor:pointer}
  .modo button+button{border-left:1px solid var(--line)}
  .modo button:hover{color:var(--ink)}
  .modo button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
  @media(max-width:760px){.intro{grid-template-columns:1fr;padding-block:48px 28px}}

  .layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:56px;padding-block:48px 110px}
  .layout>*{min-width:0}
  .toc{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:thin;padding-right:6px}
  .toc summary{list-style:none;font-size:13px;color:var(--ink3);margin-bottom:12px;cursor:pointer}
  .toc summary::-webkit-details-marker{display:none}
  .toc .modo{margin-bottom:18px}
  .toc .modo button{font-size:12.5px;padding:6px 10px}
  .toc a{display:block;color:var(--ink2);text-decoration:none;padding:3px 0;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
  .toc a.l2{margin-top:12px;color:var(--ink)}
  .toc a.l2:first-of-type{margin-top:0}
  .toc a.l3{font-size:13.5px;color:var(--ink3);padding-left:12px}
  .toc a:hover,.toc a.on{color:var(--ink)}
  .toc a.l3.on{box-shadow:inset 2px 0 0 var(--ink)}
  @media(max-width:900px){.layout{grid-template-columns:1fr;gap:24px}.toc{position:static;max-height:none;border-bottom:1px solid var(--line);padding-bottom:18px}}

  .cap{border-top:1px solid var(--line);padding-top:30px;margin-top:96px}
  .cap:first-child{border-top:0;padding-top:0;margin-top:0}
  .cap h2{font-size:clamp(36px,4.6vw,52px);font-weight:300;letter-spacing:-.03em;line-height:1.05}
  .cap .lead{font-size:20px;color:var(--ink);line-height:1.5;max-width:640px;margin-top:14px}
  .solo{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:0;color:var(--motor);border:1px solid currentColor;border-radius:4px;padding:1px 6px;vertical-align:middle;margin-left:10px;white-space:nowrap}
  .cap h2 .solo{font-size:12px;position:relative;top:-6px}

  .unidad{margin-top:52px}
  .unidad:first-of-type{margin-top:0}
  .cap h2+.unidad{margin-top:0}
  .unidad.con-figuras{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px 48px;align-items:start}
  .texto{max-width:640px;min-width:0}
  .texto h3{font-size:24px;font-weight:400;letter-spacing:-.01em;line-height:1.2;margin-bottom:4px}
  .texto p{font-size:17px;color:var(--ink2);line-height:1.66;margin-top:14px}
  .texto p b,.texto li b{color:var(--ink)}
  .texto ul{margin:14px 0 0 20px}
  .texto li{font-size:17px;color:var(--ink2);line-height:1.6;margin-top:8px}
  .texto li::marker{color:var(--ink3)}
  .texto a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--edge)}
  .texto a:hover{border-color:var(--ink)}
  .figuras{display:flex;flex-direction:column;gap:26px;position:sticky;top:24px;padding-top:6px}
  .ancho{grid-column:1/-1;margin-top:28px}

  .fig{margin:0}
  .fig img{display:block;width:100%;height:auto;border-radius:var(--r-sheet);border:1px solid var(--line2);background:var(--paper)}
  .fig.pantalla img{max-width:230px}
  .fig figcaption{font-size:13.5px;color:var(--ink3);line-height:1.45;margin-top:9px;max-width:420px}
  .fig figcaption code{font-size:.82em}
  .texto .fig.dibujo{margin:26px 0 8px;max-width:600px}
  .fig.dibujo svg{display:block;width:100%;height:auto}
  .fig.dibujo svg .mono{font-family:var(--mono)}
  .fig.dibujo svg .sans{font-family:var(--sans)}
  .ancho .fig.dibujo{max-width:940px}
  .grupo{display:grid;gap:18px}
  .figuras .grupo.pantallas{grid-template-columns:1fr 1fr}
  .ancho .grupo{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .ancho>.fig.captura{max-width:440px}
  .ancho .grupo.pantallas{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .fig.pendiente{display:none}
  html.borrador .fig.pendiente{display:block}
  .hueco{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:var(--r-sheet);display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-family:var(--mono);font-size:11px;color:var(--ink3)}

  .fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:22px}
  .u-engines .texto,.u-fx-inserts .texto,.u-mix-effects .texto,.u-settings .texto{max-width:none}
  .ficha{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r-sheet);padding:16px 18px 12px}
  .ficha h4{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--ink)}
  .ficha .sub{font-size:14px;color:var(--ink3);margin-top:2px;line-height:1.45}
  .ficha .nota{font-size:14px;color:var(--ink3);margin-top:10px;line-height:1.5}
  .ficha dl{margin-top:10px}
  .ficha dl div{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:7px 0;border-top:1px solid var(--line2)}
  .ficha dt{min-width:84px}
  .ficha dd{flex:1 1 150px}
  .ficha dt code{font-size:12.5px}
  .ficha dd{font-size:14.5px;color:var(--ink2);line-height:1.45}

  .texto ul.terms{list-style:none;margin-left:0;columns:2;column-gap:40px}
  .texto ul.terms li{font-size:15px;margin-top:6px;break-inside:avoid}
  .u-licenses p{font-size:14px;color:var(--ink3);line-height:1.55}

  @media(max-width:1120px){
    .unidad.con-figuras{grid-template-columns:minmax(0,1fr)}
    .figuras{position:static;flex-direction:row;flex-wrap:wrap;gap:22px}
    .figuras>*{flex:1 1 260px;max-width:380px}
  }
  @media(max-width:600px){.texto ul.terms{columns:1}.texto code,.fig figcaption code{white-space:normal;overflow-wrap:anywhere}}

  footer{border-top:1px solid var(--line);padding-block:56px 72px}
  footer .row{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap}
  footer .links a{display:block;font-size:16px;color:var(--ink2);text-decoration:none;margin-bottom:10px}
  footer .links a:hover{color:var(--ink)}
  footer .print{font-size:13px;color:var(--ink3);margin-top:40px}
  .langs{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:28px;font-size:14px}
  .langs a{color:var(--ink3,#8a8a85);text-decoration:none}
  .langs a:hover,.langs a[aria-current]{color:inherit;text-decoration:underline;text-underline-offset:4px}
  .langpick{position:relative;font-size:14px}
  .langpick summary{list-style:none;cursor:pointer;color:var(--ink2,#9a9a95);padding:4px 8px;border:1px solid currentColor;border-radius:6px;text-transform:lowercase}
  .langpick summary::-webkit-details-marker{display:none}
  .langpick[open] summary{color:var(--ink,#e6e2d3)}
  .langmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;display:grid;grid-template-columns:repeat(3,max-content);gap:6px 18px;padding:14px 16px;background:var(--bg,#141412);border:1px solid var(--line,#3a3a36);border-radius:8px}
  .langmenu a{color:var(--ink2,#9a9a95);text-decoration:none;white-space:nowrap}
  .langmenu a:hover,.langmenu a[aria-current]{color:var(--ink,#e6e2d3);text-decoration:underline;text-underline-offset:4px}
  @media(max-width:520px){.langmenu{grid-template-columns:repeat(2,max-content)}}
</style>
</head>

<script>
  const raiz = document.documentElement;
  const botones = [...document.querySelectorAll('.modo button')];
  function ponerModo(modo) {
    raiz.dataset.modo = modo;
    botones.forEach(b => b.setAttribute('aria-checked', String(b.dataset.modo === modo)));
  }
  ponerModo(raiz.dataset.modo);
  botones.forEach(b => b.addEventListener('click', () => ponerModo(b.dataset.modo)));

  // Section addresses used to be Spanish in every language. Old links keep working.
  const anclasViejas = {"empezar":"getting-started","que-necesitas":"what-you-need","los-dos-modos":"the-two-modes","la-pantalla":"the-screen","tu-primera-toma":"your-first-take","grabar":"recording","armar-y-grabar":"arm-and-record","que-la-toma-empiece-sola":"let-the-take-start-itself","pistas":"tracks","looper-en-vivo":"live-looper","varias-fuentes-a-la-vez":"recording-several-inputs-at-once","grabar-el-synth":"recording-the-synth","de-donde-entra-el-audio":"where-the-audio-comes-in","velocidad-y-loop":"speed-and-loop","velocidad":"speed","moverte-por-la-cinta":"moving-around-the-tape","editar":"editing","la-barra-de-edicion":"the-edit-bar","herramientas-de-la-pista":"track-tools","volcar-dos-pistas-en-una":"bouncing-two-tracks-into-one","elegir-un-sonido":"picking-a-sound","el-sonido-de-cada-pista":"each-tracks-sound","dar-forma-al-sonido":"shaping-the-sound","mezclar":"mixing","tiras-de-canal":"channel-strips","efectos":"effects","plugins-de-otras-apps":"plugins-from-other-apps","eq-maestro":"master-eq","por-donde-pasa-el-sonido":"where-the-sound-goes","cintas-y-exportar":"tapes-and-export","tus-cintas":"your-tapes","exportar":"export","con-otras-apps":"with-other-apps","sincronizar-el-tempo":"syncing-tempo","tocar-con-un-teclado-midi":"playing-from-a-midi-keyboard","tapedesk-como-plugin":"tapedesk-as-a-plugin","fichas":"reference","motores":"engines","insertos-de-fx":"fx-inserts","efectos-de-mezcla":"mix-effects","ajustes":"settings","indice-de-terminos":"index-of-terms","licencias":"licenses"};
  const vieja = anclasViejas[location.hash.slice(1)];
  if (vieja) {
    history.replaceState(null, '', '#' + vieja);
    addEventListener('DOMContentLoaded', () => document.getElementById(vieja)?.scrollIntoView());
    document.getElementById(vieja)?.scrollIntoView();
  }

  const toc = document.querySelector('.toc');
  if (window.matchMedia('(max-width:900px)').matches) toc.removeAttribute('open');
  const enlaces = [...toc.querySelectorAll('a')];
  const porId = new Map(enlaces.map(a => [a.hash.slice(1), a]));
  // The address always names the section you are reading, so it can be copied
  // and sent. replaceState: no new history entry per section.
  const idiomas = [...document.querySelectorAll('a[hreflang]')];
  idiomas.forEach(a => a.dataset.base = a.getAttribute('href'));
  function marcarSeccion(id) {
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
    idiomas.forEach(a => a.setAttribute('href', a.dataset.base + '#' + id));
  }
  const vigia = new IntersectionObserver(entradas => {
    entradas.forEach(e => {
      if (!e.isIntersecting) return;
      enlaces.forEach(a => a.classList.remove('on'));
      porId.get(e.target.id)?.classList.add('on');
      marcarSeccion(e.target.id);
    });
  }, {rootMargin: '0px 0px -80% 0px'});
  const titulos = [...document.querySelectorAll('.doc h2[id],.doc h3[id]')];
  const etiquetaEnlace = '{{COPY_LINK}}';
  titulos.forEach(h => {
    vigia.observe(h);
    h.addEventListener('click', () => marcarSeccion(h.id));
    const boton = document.createElement('button');
    boton.className = 'enlace';
    boton.type = 'button';
    boton.textContent = '#';
    boton.title = etiquetaEnlace;
    boton.setAttribute('aria-label', etiquetaEnlace);
    boton.addEventListener('click', () => {
      const url = location.href.split('#')[0] + '#' + h.id;
      const hecho = () => { boton.textContent = '✓'; setTimeout(() => boton.textContent = '#', 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(hecho, () => {});
    });
    h.appendChild(boton);
  });
  if (location.hash) idiomas.forEach(a => a.setAttribute('href', a.dataset.base + location.hash));
</script>
<script>
  (function(){var l=document.documentElement.lang||'en';document.querySelectorAll('.langpick').forEach(function(d){
    var s=d.querySelector('summary');if(s)s.textContent=l.toLowerCase();
    d.querySelectorAll('a[hreflang]').forEach(function(a){if(a.getAttribute('hreflang')===l)a.setAttribute('aria-current','page');});});})();
</script>
